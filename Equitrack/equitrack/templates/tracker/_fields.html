{% for field in form %}
  <div class="field-group {% if field.is_hidden %}field-hidden{% endif %}">
    {% if not field.is_hidden %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark">*</span>{% endif %}</label>{% endif %}
    {{ field }}
    {% if field.help_text %}<div class="field-help">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
  </div>
{% endfor %}
{% for error in form.non_field_errors %}<div class="field-error">{{ error }}</div>{% endfor %}
